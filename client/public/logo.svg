<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#e11d48" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="128" fill="url(#darkBg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.4" fill="none"/>
  
  <!-- Outer Gold Ring Accent -->
  <circle cx="256" cy="256" r="190" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Core Brand Glowing Circle -->
  <circle cx="256" cy="256" r="160" fill="url(#brandGrad)" filter="url(#glow)"/>

  <!-- Gourmet Cloche & Cutlery Motif -->
  <g transform="translate(256, 256)">
    <!-- Cloche Top Knob -->
    <circle cx="0" cy="-84" r="16" fill="url(#goldGrad)"/>
    
    <!-- Cloche Dome -->
    <path d="M -90 -16 C -90 -76 90 -76 90 -16 Z" fill="#ffffff" opacity="0.95"/>
    
    <!-- Cloche Rim Base -->
    <rect x="-106" y="-12" width="212" height="14" rx="7" fill="url(#goldGrad)"/>
    
    <!-- Steam Swirls -->
    <path d="M -30 -105 C -36 -120 -20 -130 -25 -145" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M 0 -108 C -6 -125 10 -135 5 -152" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 30 -105 C 24 -120 40 -130 35 -145" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.85"/>
    
    <!-- Crossed Fork & Spoon / Chef Plate Underneath -->
    <!-- Serving Plate Line -->
    <path d="M -120 18 Q 0 42 120 18" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" fill="none"/>
    
    <!-- Modern Stars Accent -->
    <path d="M 0 52 L 4 64 L 16 64 L 7 71 L 10 82 L 0 75 L -10 82 L -7 71 L -16 64 L -4 64 Z" fill="url(#goldGrad)"/>
    <path d="M -50 56 L -47 64 L -38 64 L -45 69 L -43 77 L -50 72 L -57 77 L -55 69 L -62 64 L -53 64 Z" fill="url(#goldGrad)" transform="scale(0.7) translate(-20, 20)"/>
    <path d="M 50 56 L 53 64 L 62 64 L 55 69 L 57 77 L 50 72 L 43 77 L 45 69 L 38 64 L 47 64 Z" fill="url(#goldGrad)" transform="scale(0.7) translate(50, 20)"/>
  </g>
</svg>
